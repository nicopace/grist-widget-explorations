<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pending rows (auto-bootstrap)</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1a2333; }
  #wrap { height: 100vh; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px; box-sizing: border-box; }
  #status { font-size: 12px; font-weight: 600; white-space: nowrap; }
  #status.work { color: #5b6478; }
  #status.ok { color: #157f3d; }
  #status.err { color: #b42318; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #cfd5e1; flex: 0 0 auto; }
  #dot.ok { background: #157f3d; }
  #dot.err { background: #b42318; }
  #dot.work { background: #fbbf24; }
</style>
</head>
<body>
<div id="wrap" title="Auto-creates missing B1/B2 rows">
  <span id="dot"></span>
  <span id="status">…</span>
</div>
<script>
  // Auto-bootstrap widget. On load it ensures every submission has the rows the
  // junction-grid needs, then reports. No button — runs with no manual action.
  // Scope is chosen per page via the widget URL: ?scope=b1 or ?scope=b2 (default all).
  var SCOPE = (function () {
    var m = /[?&]scope=([a-z0-9]+)/i.exec(location.search);
    return m ? m[1].toLowerCase() : 'all';
  })();

  var TABLES = {
    sub: 'Submission',
    b1: 'B1_Work_on_the_ground',
    b2: 'B2_Threat',
    b1j: 'B1_Community_Check',
    b2j: 'B2_Community_Check',
  };
  var state = { subs: [], b1s: [], b2s: [], b1j: [], b2j: [] };
  var dot = document.getElementById('dot');
  var statusEl = document.getElementById('status');

  function V(v) { return Array.isArray(v) ? v[v.length - 1] : v; }
  function normId(v) { v = V(v); return Array.isArray(v) ? v[v.length - 1] : v; }
  function asList(v) {
    if (v === null || v === undefined) return [];
    if (Array.isArray(v)) return (v[0] === 'L' ? v.slice(1) : v).map(normId)
      .filter(function (x) { return x !== null && x !== undefined && x !== ''; })
      .map(Number).filter(function (x) { return isFinite(x) && x > 0; });
    var n = Number(normId(v));
    return (isFinite(n) && n > 0) ? [n] : [];
  }
  function rowsOf(t) {
    t = t || {}; var out = [], n = (t.id || []).length;
    for (var i = 0; i < n; i++) {
      var r = { id: t.id[i] };
      Object.keys(t).forEach(function (c) { if (c !== 'id') r[c] = t[c][i]; });
      out.push(r);
    }
    return out;
  }
  function set(cls, txt) {
    dot.className = cls;
    statusEl.className = cls;
    statusEl.textContent = txt;
  }

  function fetchAll() {
    return Promise.all([
      grist.docApi.fetchTable(TABLES.sub),
      grist.docApi.fetchTable(TABLES.b1),
      grist.docApi.fetchTable(TABLES.b2),
      grist.docApi.fetchTable(TABLES.b1j),
      grist.docApi.fetchTable(TABLES.b2j),
    ]).then(function (ts) {
      state.subs = rowsOf(ts[0]);
      state.b1s = rowsOf(ts[1]);
      state.b2s = rowsOf(ts[2]);
      state.b1j = rowsOf(ts[3]);
      state.b2j = rowsOf(ts[4]);
    });
  }

  function analyze() {
    var b1_by_sub = {}, b2_by_sub = {};
    state.b1s.forEach(function (r) { b1_by_sub[Number(normId(r.Submission))] = r.id; });
    state.b2s.forEach(function (r) { b2_by_sub[Number(normId(r.Submission_B2))] = r.id; });
    var b1j_keys = {}, b2j_keys = {};
    state.b1j.forEach(function (r) { b1j_keys[Number(normId(r.B1)) + ':' + Number(normId(r.Community))] = 1; });
    state.b2j.forEach(function (r) { b2j_keys[Number(normId(r.B2)) + ':' + Number(normId(r.Community))] = 1; });
    var parents = 0, jun = 0;
    state.subs.forEach(function (s) {
      var sid = s.id, comms = asList(s.Communities);
      if ((SCOPE === 'all' || SCOPE === 'b1') && !b1_by_sub[sid]) parents++;
      if ((SCOPE === 'all' || SCOPE === 'b2') && !b2_by_sub[sid]) parents++;
      var b1id = b1_by_sub[sid], b2id = b2_by_sub[sid];
      comms.forEach(function (c) {
        if ((SCOPE === 'all' || SCOPE === 'b1') && b1id && !b1j_keys[b1id + ':' + c]) jun++;
        if ((SCOPE === 'all' || SCOPE === 'b2') && b2id && !b2j_keys[b2id + ':' + c]) jun++;
      });
    });
    return { parents: parents, jun: jun, total: parents + jun,
             b1_by_sub: b1_by_sub, b2_by_sub: b2_by_sub, b1j_keys: b1j_keys, b2j_keys: b2j_keys };
  }

  function bootstrap() {
    set('work', '…');
    return fetchAll().then(function () {
      var a = analyze();

      var parentActions = [];
      state.subs.forEach(function (s) {
        if ((SCOPE === 'all' || SCOPE === 'b1') && !a.b1_by_sub[s.id]) parentActions.push(['AddRecord', TABLES.b1, null, { Submission: s.id }]);
        if ((SCOPE === 'all' || SCOPE === 'b2') && !a.b2_by_sub[s.id]) parentActions.push(['AddRecord', TABLES.b2, null, { Submission_B2: s.id }]);
      });

      var p = Promise.resolve();
      if (parentActions.length) p = grist.docApi.applyUserActions(parentActions);

      return p.then(fetchAll).then(function () {
        var a2 = analyze();

        var backlinks = [];
        state.subs.forEach(function (s) {
          if (SCOPE === 'all' || SCOPE === 'b1') {
            var curB1 = Number(normId(s.B1)) || 0;
            if (a2.b1_by_sub[s.id] && curB1 !== a2.b1_by_sub[s.id]) backlinks.push(['UpdateRecord', TABLES.sub, s.id, { B1: a2.b1_by_sub[s.id] }]);
          }
          if (SCOPE === 'all' || SCOPE === 'b2') {
            var curB2 = Number(normId(s.B2)) || 0;
            if (a2.b2_by_sub[s.id] && curB2 !== a2.b2_by_sub[s.id]) backlinks.push(['UpdateRecord', TABLES.sub, s.id, { B2: a2.b2_by_sub[s.id] }]);
          }
        });

        var junActions = [];
        state.subs.forEach(function (s) {
          var sid = s.id, comms = asList(s.Communities);
          var b1id = a2.b1_by_sub[sid], b2id = a2.b2_by_sub[sid];
          comms.forEach(function (c) {
            if ((SCOPE === 'all' || SCOPE === 'b1') && b1id && !a2.b1j_keys[b1id + ':' + c]) {
              junActions.push(['AddRecord', TABLES.b1j, null, { B1: b1id, Community: c, Submission: sid }]);
              a2.b1j_keys[b1id + ':' + c] = 1;
            }
            if ((SCOPE === 'all' || SCOPE === 'b2') && b2id && !a2.b2j_keys[b2id + ':' + c]) {
              junActions.push(['AddRecord', TABLES.b2j, null, { B2: b2id, Community: c, Submission: sid }]);
              a2.b2j_keys[b2id + ':' + c] = 1;
            }
          });
        });

        var actions = backlinks.concat(junActions);
        var q = Promise.resolve();
        if (actions.length) q = grist.docApi.applyUserActions(actions);
        return q.then(fetchAll).then(function () {
          var a3 = analyze();
          if (a3.total > 0) { set('err', '!' + a3.total); }
          else if (actions.length) { set('ok', '+' + actions.length); }
          else { set('ok', '✓'); }
        });
      });
    }).catch(function (e) {
      set('err', '! ' + ((e && e.message) || e));
    });
  }

  grist.ready({ requiredAccess: 'full' });
  bootstrap();
</script>
</body>
</html>
