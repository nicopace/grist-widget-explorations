<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anomaly Scope</title>
<script src="http://localhost:47478/grist-plugin-api.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; color: #e6edf3; font-family: -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100vh; padding: 12px 16px; box-sizing: border-box; }
  #head { display: flex; align-items: baseline; gap: 12px; }
  #head h1 { margin: 0; font-size: 17px; letter-spacing: 2px; }
  #head h1 span { color: #22d3ee; }
  #scope { font-size: 12px; color: #fbbf24; font-weight: 700; }
  #stats { margin-left: auto; font-size: 12px; color: #9aa4c7; font-variant-numeric: tabular-nums; }
  #stats b.w { color: #fb923c; } #stats b.a { color: #f87171; } #stats b.n { color: #34d399; }
  #stage { position: relative; flex: 1; min-height: 0; margin-top: 8px; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #legend { display: flex; gap: 8px; font-size: 11px; color: #9aa4c7; margin-top: 8px; flex-wrap: wrap; }
  #legend button { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #9aa4c7;
    border-radius: 12px; padding: 2px 10px; font-size: 11px; cursor: pointer; }
  #legend button.sel { color: #fff; border-color: #22d3ee; background: rgba(34,211,238,.14); font-weight: 700; }
  #dbg { font-size: 10px; color: #6e7681; margin-top: 6px; font-family: monospace; }
  #legend .sel { color: #fff; font-weight: 700; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head"><h1>ANOMALY <span>SCOPE</span></h1><div id="scope">ALL MISSIONS</div><div id="stats">—</div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="legend"></div>
  <div id="dbg">boot</div>
</div>
<script>
  var V = function(v){ return (Array.isArray(v) ? v[v.length-1] : v); };
  var MCOL = ['#818cf8','#22d3ee','#fbbf24','#f472b6','#34d399','#fb923c'];
  var state = { pts: [], names: {}, t0: Date.now(), selMission: null, selSol: null };
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  function fit(){ var r = cv.parentElement.getBoundingClientRect(); cv.width = Math.max(50,r.width); cv.height = Math.max(50,r.height); }
  window.addEventListener('resize', fit); fit();

  function dbg(m){ try { document.getElementById('dbg').textContent = new Date().toLocaleTimeString() + ' ' + m; } catch(e){} }
  function toggleMission(mid){
    mid = String(mid);
    state.selMission = (state.selMission!==null && String(state.selMission)===mid) ? null : mid;
    state.selSol = null; refresh();
  }
  function missionColor(mid){
    var ids = Object.keys(state.names);
    var i = ids.indexOf(String(mid));
    return MCOL[(i < 0 ? 0 : i) % MCOL.length];
  }

  function draw(){
    var W=cv.width, H=cv.height, t=(Date.now()-state.t0)/1000, pad={l:44,r:12,t:10,b:24};
    cx.fillStyle='#070b14'; cx.fillRect(0,0,W,H);
    var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
    if (!state.pts.length){ cx.fillStyle='#8b949e'; cx.font='12px sans-serif'; cx.fillText('Awaiting telemetry…', pad.l, H/2); requestAnimationFrame(draw); return; }
    var sols=state.pts.map(function(p){return p.sol;}), pws=state.pts.map(function(p){return p.pw;});
    var sx0=Math.min.apply(null,sols), sx1=Math.max.apply(null,sols), sy0=Math.min.apply(null,pws), sy1=Math.max.apply(null,pws);
    if (sx1===sx0) sx1=sx0+1; if (sy1===sy0) sy1=sy0+1;
    var X=function(s){return pad.l+(s-sx0)/(sx1-sx0)*iw;}, Y=function(p){return pad.t+ih-(p-sy0)/(sy1-sy0)*ih;};
    cx.strokeStyle='rgba(255,255,255,.07)'; cx.fillStyle='#8b949e'; cx.font='10px sans-serif'; cx.lineWidth=1;
    for (var g=0; g<=4; g++){ var gy=pad.t+ih*g/4, gv=sy1-(sy1-sy0)*g/4;
      cx.beginPath(); cx.moveTo(pad.l,gy); cx.lineTo(W-pad.r,gy); cx.stroke(); cx.fillText(gv.toFixed(1), 4, gy+3); }
    for (var s2=Math.ceil(sx0/50)*50; s2<=sx1; s2+=50){ var gx=X(s2);
      cx.beginPath(); cx.moveTo(gx,pad.t); cx.lineTo(gx,pad.t+ih); cx.stroke(); cx.fillText('S'+s2, gx-8, H-8); }
    cx.fillStyle='#8b949e'; cx.fillText('kW ↑', 6, pad.t-2);
    var byM={}; state.pts.forEach(function(p){ (byM[p.m]=byM[p.m]||[]).push(p); });
    Object.keys(byM).forEach(function(m){
      var arr=byM[m].slice().sort(function(a,b){return a.sol-b.sol;});
      var sel = state.selMission===null || String(state.selMission)===String(m);
      cx.strokeStyle=missionColor(m); cx.globalAlpha=sel?0.85:0.12; cx.lineWidth=sel?2.5:1.5; cx.beginPath();
      arr.forEach(function(p,i){ i===0?cx.moveTo(X(p.sol),Y(p.pw)):cx.lineTo(X(p.sol),Y(p.pw)); });
      cx.stroke(); cx.globalAlpha=1;
    });
    state.pts.forEach(function(p){
      var dim = state.selMission!==null && String(state.selMission)!==String(p.m);
      var x=X(p.sol), y=Y(p.pw), hot=p.z!==null&&(Math.abs(p.z)>1.2);
      cx.globalAlpha = dim ? 0.25 : 1;
      if (p.z!==null&&Math.abs(p.z)>2){
        var rr=6+4*Math.abs(Math.sin(t*3));
        cx.strokeStyle='#f87171'; cx.globalAlpha=dim?0.2:0.8; cx.lineWidth=2;
        cx.beginPath(); cx.arc(x,y,rr,0,6.29); cx.stroke(); cx.globalAlpha=dim?0.25:1;
      } else if (hot){
        var r2=5+2.5*Math.abs(Math.sin(t*3));
        cx.strokeStyle='#fb923c'; cx.globalAlpha=dim?0.15:0.7;
        cx.beginPath(); cx.arc(x,y,r2,0,6.29); cx.stroke(); cx.globalAlpha=dim?0.25:1;
      }
      cx.fillStyle = p.sig==='Lost' ? '#f87171' : (p.sig==='Weak' ? '#fb923c' : '#34d399');
      cx.beginPath(); cx.arc(x,y,3.4,0,6.29); cx.fill(); cx.globalAlpha=1;
      if (!dim && state.selSol!==null && p.sol===state.selSol && String(p.m)===String(state.selMission)){
        cx.strokeStyle='#fff'; cx.lineWidth=1.5;
        cx.beginPath(); cx.arc(x,y,8,0,6.29); cx.stroke();
        cx.beginPath(); cx.moveTo(x,pad.t); cx.lineTo(x,pad.t+ih); cx.strokeStyle='rgba(255,255,255,.35)'; cx.stroke();
      }
    });
    requestAnimationFrame(draw);
  }

  function toPts(T){
    return T.map(function(r){ var z=Number(V(r.Power_z));
      return { m: V(r.Mission), sol: Number(V(r.Sol)), pw: Number(V(r.Power_kW)),
        z: isFinite(z)?z:null, sig: V(r.Signal) }; })
      .filter(function(p){ return isFinite(p.sol)&&isFinite(p.pw); });
  }

  function refresh(){
    var n=state.pts.length, w=0, a=0;
    state.pts.forEach(function(p){ if(p.z===null) return; var z=Math.abs(p.z); if(z>2)a++; else if(z>1.2)w++; });
    var scope = state.selMission===null ? 'ALL MISSIONS' : ('● ' + (state.names[state.selMission]||('Mission #'+state.selMission)));
    document.getElementById('scope').textContent = scope;
    document.getElementById('stats').innerHTML = n+' pts · <b class="n">'+(n-w-a)+' nominal</b> · <b class="w">'+w+' watch</b> · <b class="a">'+a+' anomaly</b>';
    var seen={}, leg='';
    state.pts.forEach(function(p){ if(seen[p.m])return; seen[p.m]=1;
      var sel = state.selMission!==null && String(state.selMission)===String(p.m);
      leg += '<button class="'+(sel?'sel':'')+'" onclick="toggleMission(\''+p.m+'\')">'+(state.names[p.m]||('Mission #'+p.m))+'</button>'; });
    document.getElementById('legend').innerHTML = leg;
  }

  grist.ready({ requiredAccess: 'full' });
  function normT(t){ t=t||{}; var out=[], n=(t.id||[]).length;
    for (var i=0;i<n;i++){ var r={id:t.id[i]}; Object.keys(t).forEach(function(c){ if(c!=='id')r[c]=t[c][i]; }); out.push(r); } return out; }
  function handleTeleRows(T){
    state.pts = toPts(T);
    refresh();
  }
  function loadAll(){
    Promise.all([grist.docApi.fetchTable('Telemetry'), grist.docApi.fetchTable('Missions')]).then(function(ts){
      var names={}; normT(ts[1]).forEach(function(m){ names[m.id]=V(m.Name); });
      state.names = names;
      handleTeleRows(normT(ts[0]));
    }).catch(function(e){ document.getElementById('stats').textContent = 'Load failed: '+((e&&e.message)||e); });
  }
  grist.onRecords(function(rows){
    dbg('onRecords n=' + (rows ? rows.length : 'null') + ' keys=' + (rows && rows[0] ? Object.keys(rows[0]).join(',') : '—'));
    if (rows && rows.length && ('Sol' in rows[0] || 'Power_kW' in rows[0])) { handleTeleRows(rows); return; }
    loadAll();
  });
  grist.onRecord(function(r){
    dbg('onRecord keys=' + (r ? Object.keys(r).join(',') : 'null'));
    if (!r) return;
    if ('Outcome' in r){ // mission row from linked Missions grid
      var id = (state.selMission!==null && String(state.selMission)===String(r.id)) ? null : r.id;
      state.selMission = id; state.selSol = null; refresh();
    } else if ('Sol' in r){ // telemetry cursor
      state.selMission = V(r.Mission); state.selSol = Number(V(r.Sol)); refresh();
    }
  });
  loadAll();
  requestAnimationFrame(draw);
</script>
</body>
</html>
