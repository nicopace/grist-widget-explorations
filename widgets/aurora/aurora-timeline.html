<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mission Timeline</title>
<script src="http://localhost:47478/grist-plugin-api.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #101828; color: #fff; }
  #box { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box; }
  #name { font-size: 24px; font-weight: bold; }
  #line { font-size: 15px; margin-top: 8px; color: #c7d2fe; }
  #bar { width: 100%; max-width: 520px; height: 14px; background: #344054; border-radius: 7px; margin-top: 12px; overflow: hidden; }
  #fill { height: 100%; background: linear-gradient(90deg, #53b1fd, #7a5af8); width: 0%; }
  #pct { font-size: 13px; margin-top: 6px; color: #98a2b3; }
</style>
</head>
<body>
<div id="box"><div id="name">Waiting…</div></div>
<script>
  function val(v) { return (Array.isArray(v) ? v[v.length - 1] : v); }
  function toMs(d) { if (d === null || d === undefined || d === '') return null; if (typeof d === 'number') return d < 1e12 ? d * 1000 : d; var t = Date.parse(d); return isNaN(t) ? null : t; }
  function render(r) {
    var box = document.getElementById('box');
    if (!r || val(r.Name) === null || val(r.Name) === undefined || val(r.Name) === '') {
      box.innerHTML = '<div id="name">No mission selected</div>';
      return;
    }
    var l = toMs(val(r.Launch_Date)), e = toMs(val(r.Return_Date)), now = Date.now();
    var day = 86400000, line, pct;
    if (l === null) { line = 'Launch date TBD'; pct = 0; }
    else if (now < l) { line = 'T-' + Math.ceil((l - now) / day) + ' days to launch'; pct = 0; }
    else if (e === null || now <= e) { line = 'Day +' + Math.floor((now - l) / day) + ' in flight'; pct = e ? Math.min(100, ((now - l) / (e - l)) * 100) : 100; }
    else { line = 'Returned ' + Math.floor((now - e) / day) + ' days ago'; pct = 100; }
    box.innerHTML = '<div id="name">' + r.Name + '</div><div id="line">' + line + '</div>'
      + '<div id="bar"><div id="fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
      + '<div id="pct">' + pct.toFixed(0) + '% of mission window</div>';
  }
  grist.ready({ requiredAccess: 'read table', columns: ['Name', 'Launch_Date', 'Return_Date'] });
  grist.onRecord(function(record) { render(record); });
</script>
</body>
</html>
